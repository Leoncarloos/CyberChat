<rect x="48" y="508" width="302" height="159" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="199" y="558.2" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>El usuario pregunta en el chat</tspan></text><text x="199" y="583.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>el servidor recibe el historial;</tspan></text><text x="199" y="607.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>la búsqueda usa solo el último</tspan></text><text x="199" y="631.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>mensaje</tspan></text>
