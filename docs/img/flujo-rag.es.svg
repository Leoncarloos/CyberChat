<rect x="824" y="143" width="318" height="159" rx="20" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="983" y="179.7" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Fragmenta por secciones</tspan></text><text x="983" y="206.6" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>y oraciones</tspan></text><text x="983" y="231.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>máx. 120 tokens por fragmento,</tspan></text><text x="983" y="255.8" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>con «Documento» y «Sección» ·</tspan></text><text x="983" y="280.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>solapa 1 oración corta</tspan></text>
<rect x="1236" y="143" width="302" height="159" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/><text x="1387" y="179.7" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Genera un embedding</tspan></text><text x="1387" y="206.6" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>por fragmento</tspan></text><text x="1387" y="231.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Hugging Face · paraphrase-</tspan></text><text x="1387" y="255.8" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>multilingual-MiniLM-L12-v2 ·</tspan></text><text x="1387" y="280.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>384 dim. · sin recortar texto</tspan></text>
