<rect x="697" y="746" width="333" height="160" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/><text x="863.5" y="784.5" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>El LLM genera la respuesta</tspan></text><text x="863.5" y="809.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Groq · openai/gpt-oss-20b ·</tspan></text><text x="863.5" y="833.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>últimos 12 mensajes · temp. 0.15</tspan></text><text x="863.5" y="858.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>· máx. 900 tokens · negativa</tspan></text><text x="863.5" y="882.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>genérica → mensaje de alcance</tspan></text>
<rect x="697" y="950" width="333" height="110" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="863.5" y="987.8" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Respuesta fija, sin LLM</tspan></text><text x="863.5" y="1012.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>«No encontré evidencia</tspan></text><text x="863.5" y="1037.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>suficiente…»</tspan></text>
<rect x="207" y="746" width="333" height="175" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="373.5" y="779.8" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Respuesta al usuario</tspan></text><text x="373.5" y="804.8" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>fuentes: documento, similitud y</tspan></text><text x="373.5" y="829.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>vista previa · el chat muestra</tspan></text><text x="373.5" y="853.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>citas [1] y «Fragmentos citados»</tspan></text><text x="373.5" y="877.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>y guarda la respuesta con los</tspan></text><text x="373.5" y="902.0" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>fragmentos usados</tspan></text>
