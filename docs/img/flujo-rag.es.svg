<rect x="840" y="508" width="302" height="159" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/><text x="991" y="544.7" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Genera el embedding</tspan></text><text x="991" y="571.6" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>de la consulta</tspan></text><text x="991" y="596.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>mismo modelo · si pasa de 120</tspan></text><text x="991" y="620.8" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>tokens se divide (máx. 8</tspan></text><text x="991" y="645.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>partes) y se promedia</tspan></text>
<rect x="1236" y="484" width="302" height="207" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="1"/><text x="1387" y="532.6" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Búsqueda híbrida en</tspan></text><text x="1387" y="559.4" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>su empresa</tspan></text><text x="1387" y="584.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>RUC → administrador dueño ·</tspan></text><text x="1387" y="608.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>vectorial: 20 candidatos ·</tspan></text><text x="1387" y="633.0" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>léxica: texto completo · fusión</tspan></text><text x="1387" y="657.3" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>RRF: máx. 20 sin duplicados</tspan></text>
<rect x="1633" y="484" width="302" height="207" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/><text x="1784" y="546.0" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Selecciona la evidencia</tspan></text><text x="1784" y="570.9" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Groq · gpt-oss-20b elige hasta</tspan></text><text x="1784" y="595.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>5 fragmentos · si falla: los 5</tspan></text><text x="1784" y="619.6" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>más similares por vector</tspan></text><text x="1784" y="643.9" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>(similitud ≥ 0.38)</tspan></text>
