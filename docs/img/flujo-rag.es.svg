<rect x="48" y="143" width="302" height="159" rx="20" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="199" y="193.2" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Sube el documento</tspan></text><text x="199" y="218.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>PDF, DOCX o TXT · máx. 10 MB ·</tspan></text><text x="199" y="242.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>sin OCR: un documento sin</tspan></text><text x="199" y="266.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>texto legible se rechaza</tspan></text>
