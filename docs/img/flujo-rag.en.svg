<text x="46" y="1085.5" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan>Indexing</tspan></text>
<rect x="318" y="1068" width="32" height="22" rx="4" fill="#e6e6e6" stroke="#333333" stroke-width="1"/>
<text x="362" y="1085.5" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan>Query</tspan></text>
<rect x="635" y="1068" width="32" height="22" rx="4" fill="#e8eef7" stroke="#1f3a5f" stroke-width="1"/>
<text x="679" y="1085.5" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan>AI step or vector search</tspan></text>
<rect x="1108" y="1068" width="32" height="22" rx="4" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/>
<text x="1152" y="1085.5" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan>Sends text to an external service (Hugging Face or Groq)</tspan></text>
</svg>
