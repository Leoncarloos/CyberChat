<rect x="1550.75" y="787.125" width="38.5" height="27.75" fill="#ffffff"/><text x="1570" y="807.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Yes</tspan></text>
<rect x="1661.5" y="938.125" width="29" height="27.75" fill="#ffffff"/><text x="1676" y="958.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>No</tspan></text>
