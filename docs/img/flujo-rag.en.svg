<text x="3" y="35.2" font-size="27" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-weight="bold">CyberChat RAG flow</tspan></text>
<rect x="48" y="143" width="302" height="159" rx="20" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="199" y="193.2" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Uploads document</tspan></text><text x="199" y="218.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>PDF, DOCX or TXT · max. 10 MB ·</tspan></text><text x="199" y="242.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>no OCR: a document without</tspan></text><text x="199" y="266.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>readable text is rejected</tspan></text>
<rect x="428" y="143" width="318" height="159" rx="20" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="587" y="205.3" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Extracts and cleans the text</tspan></text><text x="587" y="230.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>pdf-extraction (PDF) · mammoth</tspan></text><text x="587" y="254.6" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>(DOCX) · UTF-8 (TXT)</tspan></text>
<rect x="824" y="143" width="318" height="159" rx="20" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="983" y="179.7" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Splits by sections</tspan></text><text x="983" y="206.6" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>and sentences</tspan></text><text x="983" y="231.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>max. 120 tokens per fragment,</tspan></text><text x="983" y="255.8" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>with «Document» and «Section» ·</tspan></text><text x="983" y="280.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>overlaps 1 short sentence</tspan></text>
<rect x="1236" y="143" width="302" height="159" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/><text x="1387" y="179.7" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Generates one embedding</tspan></text><text x="1387" y="206.6" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>per fragment</tspan></text><text x="1387" y="231.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Hugging Face · paraphrase-</tspan></text><text x="1387" y="255.8" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>multilingual-MiniLM-L12-v2 ·</tspan></text><text x="1387" y="280.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>384 dim. · no text truncation</tspan></text>
<path d="M1633,149 A151,14 0 0 1 1935,149 L1935,296 A151,14 0 0 1 1633,296 Z" fill="#ffffff" stroke="#333333" stroke-width="1"/><path d="M1633,149 A151,14 0 0 0 1935,149" fill="none" stroke="#333333" stroke-width="1"/><text x="1784" y="185.0" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Stores in Supabase</tspan></text><text x="1784" y="209.9" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>file in Storage · fragments and</tspan></text><text x="1784" y="234.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>vectors in PostgreSQL with</tspan></text><text x="1784" y="258.6" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>pgvector (HNSW index, cosine</tspan></text><text x="1784" y="282.9" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>distance)</tspan></text>
<rect x="48" y="508" width="302" height="159" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="199" y="558.2" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>User asks in the chat</tspan></text><text x="199" y="583.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>the server receives the history;</tspan></text><text x="199" y="607.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>retrieval uses only the last</tspan></text><text x="199" y="631.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>message</tspan></text>
<rect x="444" y="508" width="302" height="159" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="595" y="558.2" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Authenticates the user</tspan></text><text x="595" y="583.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Supabase Auth session · active</tspan></text><text x="595" y="607.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>account · role and RUC read</tspan></text><text x="595" y="631.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>from app_metadata</tspan></text>
<rect x="840" y="508" width="302" height="159" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/><text x="991" y="544.7" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Generates the query</tspan></text><text x="991" y="571.6" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>embedding</tspan></text><text x="991" y="596.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>same model · over 120 tokens it</tspan></text><text x="991" y="620.8" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>is split (max. 8 parts) and</tspan></text><text x="991" y="645.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>averaged</tspan></text>
<rect x="1236" y="484" width="302" height="207" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="1"/><text x="1387" y="532.6" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Hybrid search in</tspan></text><text x="1387" y="559.4" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>the company</tspan></text><text x="1387" y="584.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>RUC → owning administrator ·</tspan></text><text x="1387" y="608.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>vector: 20 candidates ·</tspan></text><text x="1387" y="633.0" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>lexical: full text · RRF</tspan></text><text x="1387" y="657.3" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>fusion: max. 20, no duplicates</tspan></text>
<rect x="1633" y="484" width="302" height="207" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/><text x="1784" y="546.0" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Selects the evidence</tspan></text><text x="1784" y="570.9" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Groq · gpt-oss-20b picks up to</tspan></text><text x="1784" y="595.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>5 fragments · if it fails: the</tspan></text><text x="1784" y="619.6" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>5 most similar by vector</tspan></text><text x="1784" y="643.9" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>(similarity ≥ 0.38)</tspan></text>
<polygon points="1784,730 1935,817 1784,904 1633,817" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="1784" y="810.7" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Any</tspan></text><text x="1784" y="837.6" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>evidence?</tspan></text>
<rect x="1173" y="746" width="333" height="127" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="1339.5" y="792.3" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Prompt with document context</tspan></text><text x="1339.5" y="817.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>numbered fragments · each</tspan></text><text x="1339.5" y="841.6" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>statement carries [Fuente N]</tspan></text>
<rect x="1173" y="919" width="333" height="127" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="1339.5" y="953.2" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>No document evidence</tspan></text><text x="1339.5" y="978.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>question about company policy →</tspan></text><text x="1339.5" y="1002.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>fixed answer · other question →</tspan></text><text x="1339.5" y="1026.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>general prompt</tspan></text>
<rect x="697" y="746" width="333" height="160" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/><text x="863.5" y="784.5" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>LLM generates the answer</tspan></text><text x="863.5" y="809.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Groq · openai/gpt-oss-20b · last</tspan></text><text x="863.5" y="833.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>12 messages · temp. 0.15 · max.</tspan></text><text x="863.5" y="858.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>900 tokens · generic refusal →</tspan></text><text x="863.5" y="882.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>scope message</tspan></text>
<rect x="697" y="950" width="333" height="110" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="863.5" y="987.8" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Fixed answer, no LLM</tspan></text><text x="863.5" y="1012.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>«No encontré evidencia</tspan></text><text x="863.5" y="1037.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>suficiente…» (not enough evidence)</tspan></text>
<rect x="207" y="746" width="333" height="175" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="373.5" y="779.8" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Answer to the user</tspan></text><text x="373.5" y="804.8" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>sources: document, similarity and</tspan></text><text x="373.5" y="829.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>preview · the chat shows [1]</tspan></text><text x="373.5" y="853.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>citations and «Fragmentos</tspan></text><text x="373.5" y="877.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>citados» and saves the answer</tspan></text><text x="373.5" y="902.0" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>with the fragments used</tspan></text>
<rect x="1485.5" y="359.125" width="143" height="27.75" fill="#ffffff"/><text x="1557" y="379.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>knowledge base</tspan></text>
<rect x="1550.75" y="776.125" width="38.5" height="27.75" fill="#ffffff"/><text x="1570" y="796.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Yes</tspan></text>
<rect x="1661.5" y="968.125" width="29" height="27.75" fill="#ffffff"/><text x="1676" y="988.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>No</tspan></text>
<rect x="1072.5" y="883.375" width="129" height="25.25" fill="#ffffff"/><text x="1137" y="901.8" font-size="17" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>other question</tspan></text>
<rect x="1036.5" y="1065.375" width="129" height="25.25" fill="#ffffff"/><text x="1101" y="1083.8" font-size="17" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>company policy</tspan></text>
<rect x="2" y="1128" width="32" height="22" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<text x="46" y="1145.5" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan>Indexing</tspan></text>
<rect x="318" y="1128" width="32" height="22" rx="4" fill="#e6e6e6" stroke="#333333" stroke-width="1"/>
<text x="362" y="1145.5" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan>Query</tspan></text>
<rect x="635" y="1128" width="32" height="22" rx="4" fill="#e8eef7" stroke="#1f3a5f" stroke-width="1"/>
<text x="679" y="1145.5" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan>AI step or search</tspan></text>
<rect x="1108" y="1128" width="32" height="22" rx="4" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/>
<text x="1152" y="1145.5" font-size="19" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan>Sends text to an external service (Hugging Face or Groq)</tspan></text>
</svg>
