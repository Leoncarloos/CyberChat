<text x="3" y="35.2" font-size="27" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-weight="bold">CyberChat RAG flow</tspan></text>
<rect x="48" y="143" width="302" height="159" rx="20" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="199" y="193.2" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Uploads document</tspan></text><text x="199" y="218.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>PDF, DOCX or TXT · max. 10</tspan></text><text x="199" y="242.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>MiB · no OCR: a scanned PDF</tspan></text><text x="199" y="266.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>without text is rejected</tspan></text>
<rect x="428" y="143" width="318" height="159" rx="20" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="587" y="205.3" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Extracts and cleans the text</tspan></text><text x="587" y="230.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>pdf-extraction (PDF) · mammoth</tspan></text><text x="587" y="254.6" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>(DOCX) · UTF-8 (TXT)</tspan></text>
<rect x="824" y="143" width="318" height="159" rx="20" fill="#ffffff" stroke="#333333" stroke-width="1"/><text x="983" y="205.3" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Splits by sentences</tspan></text><text x="983" y="230.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>at most 800 characters per</tspan></text><text x="983" y="254.6" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>fragment · 1-sentence overlap</tspan></text>
<rect x="1236" y="143" width="302" height="159" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/><text x="1387" y="167.6" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Generates one embedding</tspan></text><text x="1387" y="194.4" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>per fragment</tspan></text><text x="1387" y="219.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Hugging Face · paraphrase-</tspan></text><text x="1387" y="243.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>multilingual-MiniLM-L12-v2 ·</tspan></text><text x="1387" y="268.0" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>384 dim. · first 512 characters</tspan></text><text x="1387" y="292.3" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>only</tspan></text>
<path d="M1633,149 A151,14 0 0 1 1935,149 L1935,296 A151,14 0 0 1 1633,296 Z" fill="#ffffff" stroke="#333333" stroke-width="1"/><path d="M1633,149 A151,14 0 0 0 1935,149" fill="none" stroke="#333333" stroke-width="1"/><text x="1784" y="185.0" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Stores in Supabase</tspan></text><text x="1784" y="209.9" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>file in Storage · fragments and</tspan></text><text x="1784" y="234.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>vectors in PostgreSQL with</tspan></text><text x="1784" y="258.6" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>pgvector (HNSW index, cosine</tspan></text><text x="1784" y="282.9" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>distance)</tspan></text>
<rect x="48" y="508" width="302" height="159" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="199" y="558.2" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>User asks in the chat</tspan></text><text x="199" y="583.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>the server receives the history;</tspan></text><text x="199" y="607.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>retrieval uses only the last</tspan></text><text x="199" y="631.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>message</tspan></text>
<rect x="444" y="508" width="302" height="159" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="595" y="558.2" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Authenticates the user</tspan></text><text x="595" y="583.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Supabase Auth session · active</tspan></text><text x="595" y="607.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>account · role and RUC read</tspan></text><text x="595" y="631.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>from app_metadata</tspan></text>
<rect x="840" y="508" width="302" height="159" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/><text x="991" y="556.9" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Generates the query</tspan></text><text x="991" y="583.8" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>embedding</tspan></text><text x="991" y="608.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>same model as phase 1 · first</tspan></text><text x="991" y="633.0" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>512 characters</tspan></text>
<rect x="1236" y="484" width="302" height="207" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="1"/><text x="1387" y="520.4" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Resolves the organization</tspan></text><text x="1387" y="547.3" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>and searches</tspan></text><text x="1387" y="572.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>session RUC → owning</tspan></text><text x="1387" y="596.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>administrator (if not found, falls</tspan></text><text x="1387" y="620.8" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>back to the user's own id) ·</tspan></text><text x="1387" y="645.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>cosine with HNSW index · 5</tspan></text><text x="1387" y="669.5" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>candidates</tspan></text>
<rect x="1633" y="508" width="302" height="159" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="1784" y="546.0" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Filters results</tspan></text><text x="1784" y="570.9" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>removes duplicates (first 100</tspan></text><text x="1784" y="595.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>chars) · discards similarity &lt;</tspan></text><text x="1784" y="619.6" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>0.38 · no replenishment of</tspan></text><text x="1784" y="643.9" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>candidates</tspan></text>
<polygon points="1784,714 1935,801 1784,888 1633,801" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="1784" y="808.1" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Fragments left?</tspan></text>
<rect x="1173" y="746" width="333" height="111" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="1339.5" y="796.5" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Prompt with document context</tspan></text><text x="1339.5" y="821.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>fragments + scope rules</tspan></text>
<rect x="1173" y="889" width="333" height="127" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="1339.5" y="935.3" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>General-knowledge prompt</tspan></text><text x="1339.5" y="960.2" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>answer without document support ·</tspan></text><text x="1339.5" y="984.6" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>suggests uploading documents</tspan></text>
<rect x="697" y="753" width="333" height="143" rx="20" fill="#e8eef7" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="8 5"/><text x="863.5" y="795.2" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>LLM generates the answer</tspan></text><text x="863.5" y="820.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Groq · openai/gpt-oss-20b · last 12</tspan></text><text x="863.5" y="844.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>messages · temp. 0.15 · max. 900</tspan></text><text x="863.5" y="868.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>tokens</tspan></text>
<rect x="207" y="762" width="333" height="127" rx="20" fill="#e6e6e6" stroke="#333333" stroke-width="1"/><text x="373.5" y="796.2" font-size="21" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>Answer to the user</tspan></text><text x="373.5" y="821.1" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>indicates whether it used context ·</tspan></text><text x="373.5" y="845.4" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>sources with similarity % and</tspan></text><text x="373.5" y="869.7" font-size="19" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan>preview (220 chars)</tspan></text>
